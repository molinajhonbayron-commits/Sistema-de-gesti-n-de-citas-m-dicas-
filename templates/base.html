<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Citas médicas{% endblock %}</title>
  {% load static %}
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
<div class="topbar"><button id="abrir" aria-label="Abrir menú"><i class="bi bi-list"></i></button><span class="serif text-white fs-5">Citas médicas</span></div>
<div class="shell">
  <aside class="side" id="menu">
    <a class="brand" href="{% url 'inicio' %}"><span class="mark"><i class="bi bi-heart-pulse"></i></span>Citas médicas</a>
    <nav>{% for i in menu %}<a href="{{ i.url }}" class="{% if i.activo %}on{% endif %}"><i class="bi {{ i.icono }}"></i>{{ i.etq }}</a>{% endfor %}</nav>
    <div class="me">
      <div class="who"><span class="avatar">{{ iniciales }}</span><div><b>{{ user.nombre }}</b><small>{{ user.get_rol_display }}</small></div></div>
      <div class="links"><a href="{% url 'password_change' %}">Contraseña</a>
        <form method="post" action="{% url 'logout' %}" class="flex-fill d-flex">{% csrf_token %}<button>Cerrar sesión</button></form></div>
    </div>
  </aside>
  <main class="main">
    {% for m in messages %}<div class="flash {{ m.tags }}"><span>{{ m }}</span><button onclick="this.parentNode.remove()" aria-label="Cerrar">×</button></div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const m=document.getElementById('menu');document.getElementById('abrir').onclick=()=>m.classList.toggle('open');
document.querySelector('.main').onclick=()=>m.classList.remove('open');
</script>
{% block scripts %}{% endblock %}
</body>
</html>
